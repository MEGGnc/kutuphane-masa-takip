<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akıllı Kütüphane Sistemi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
min-height:100vh;
padding:25px;
background:
linear-gradient(
135deg,
#0f172a,
#172554,
#1e3a8a
);
color:white;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:15px;
}

.logo{
font-size:36px;
font-weight:bold;
}

.clock{
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
padding:15px 25px;
border-radius:15px;
text-align:center;
font-size:18px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:30px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
border-radius:20px;
padding:20px;
text-align:center;
border:1px solid rgba(255,255,255,.1);
}

.card h2{
margin-top:10px;
font-size:34px;
}

.progress{
width:100%;
height:20px;
background:#1e293b;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
width:0%;
height:100%;
background:#22c55e;
}

.search{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin-bottom:20px;
font-size:17px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.building{
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
padding:25px;
border-radius:20px;
cursor:pointer;
transition:.3s;
text-align:center;
border:1px solid rgba(255,255,255,.1);
}

.building:hover{
transform:translateY(-3px);
}

.masaGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:15px;
margin-top:20px;
}

.masa{
background:#16a34a;
padding:20px;
border-radius:15px;
text-align:center;
font-weight:bold;
cursor:pointer;
}

.backBtn{
padding:12px 25px;
border:none;
border-radius:15px;
background:#2563eb;
color:white;
cursor:pointer;
margin-bottom:15px;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.modalBox{
background:#0f172a;
padding:25px;
border-radius:20px;
width:100%;
max-width:450px;
}

.modal input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:15px;
}

.modal button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">

<div class="logo">
📚 Akıllı Kütüphane Sistemi
</div>

<div class="clock" id="clock"></div>

</div>

<div class="stats">

<div class="card">
💺
<h2>100</h2>
Toplam Masa
</div>

<div class="card">
🟢
<h2>100</h2>
Müsait Masa
</div>

<div class="card">
📊
<h2>%0</h2>
Doluluk
<div class="progress">
<div class="progress-bar"></div>
</div>
</div>

</div>

<input
class="search"
id="search"
placeholder="Bina ara..."
onkeyup="arama()"
>

<div id="anaAlan"></div>

<div class="modal" id="modal">

<div class="modalBox">

<h2 id="masaBaslik"></h2>

<p style="margin-top:15px">
🟢 Bu masa kullanılabilir.
</p>

<input
id="ogrenciNo"
placeholder="Öğrenci Numaranız"
>

<button onclick="masaAl()">
Masayı Kullan
</button>

<button onclick="kapat()">
Kapat
</button>

</div>

</div>

<script>

const binalar = [
{
isim:"📚 Kütüphane",
kod:"KTP"
},
{
isim:"🏢 Çelik Bina",
kod:"CLK"
},
{
isim:"📦 Ambar Binası",
kod:"AMB"
},
{
isim:"🏭 Fabrika Binası",
kod:"FAB"
},
{
isim:"🔬 Laboratuvar",
kod:"LAB"
}
];

let seciliMasa = null;

function saatGuncelle(){

const t = new Date();

document.getElementById("clock")
.innerHTML = `
📅 ${t.toLocaleDateString('tr-TR')}
<br>
⏰ ${t.toLocaleTimeString('tr-TR')}
`;

}

setInterval(saatGuncelle,1000);
saatGuncelle();

function kategorileriGoster(){

const alan =
document.getElementById("anaAlan");

let html =
'<div class="grid" id="kategoriGrid">';

binalar.forEach(b=>{

html += `
<div
class="building"
onclick="masalariGoster('${b.kod}','${b.isim}')"
>
<h2>${b.isim}</h2>
<br>
20 Masa
</div>
`;

});

html += '</div>';

alan.innerHTML = html;

}

function masalariGoster(kod,isim){

let html = `
<button
class="backBtn"
onclick="kategorileriGoster()"
>
← Geri
</button>

<h2>${isim}</h2>

<div class="masaGrid">
`;

for(let i=1;i<=20;i++){

html += `
<div
class="masa"
onclick="masaSec('${kod}-${String(i).padStart(3,'0')}')"
>
${kod}-${String(i).padStart(3,'0')}
<br><br>
BOŞ
</div>
`;

}

html += '</div>';

document.getElementById("anaAlan")
.innerHTML = html;

}

function masaSec(kod){

seciliMasa = kod;

document.getElementById(
"masaBaslik"
).innerHTML = kod;

document.getElementById(
"modal"
).style.display = "flex";

}

function kapat(){

document.getElementById(
"modal"
).style.display = "none";

}

function masaAl(){

const no =
document.getElementById(
"ogrenciNo"
).value;

if(!no){

alert(
"Öğrenci numarası giriniz."
);

return;

}

alert(
seciliMasa +
" seçildi.\n\nÖğrenci: " +
no
);

}

function arama(){

const metin =
document.getElementById("search")
.value.toLowerCase();

document.querySelectorAll(".building")
.forEach(k=>{

k.style.display =
k.innerText.toLowerCase()
.includes(metin)
? "block"
: "none";

});

}

kategorileriGoster();

</script>

</body>
</html>
