<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akıllı Kütüphane Sistemi</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
min-height:100vh;
padding:20px;
color:white;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:20px;
}

.logo{
font-size:32px;
font-weight:bold;
}

.clock{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:16px;
backdrop-filter:blur(10px);
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
padding:20px;
border-radius:20px;
text-align:center;
}

.card h2{
font-size:35px;
margin-top:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.building{
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
padding:25px;
border-radius:20px;
cursor:pointer;
text-align:center;
transition:.3s;
}

.building:hover{
transform:translateY(-3px);
}

.masaGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:12px;
margin-top:20px;
}

.masa{
background:#16a34a;
padding:18px;
border-radius:14px;
text-align:center;
cursor:pointer;
font-weight:bold;
}

.backBtn{
padding:12px 20px;
border:none;
background:#2563eb;
color:white;
border-radius:12px;
cursor:pointer;
margin-bottom:20px;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
justify-content:center;
align-items:center;
}

.modalBox{
background:#0f172a;
padding:25px;
border-radius:20px;
width:90%;
max-width:450px;
}

input{
width:100%;
padding:12px;
margin-top:15px;
border-radius:10px;
border:none;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
background:#2563eb;
color:white;
border-radius:10px;
cursor:pointer;
}

.user{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
display:none;
}
</style>
</head>
<body>

<div class="header">
<div class="logo">📚 Akıllı Kütüphane Sistemi</div>
<div class="clock" id="clock"></div>
</div>

<div class="user" id="userBox"></div>

<div class="stats">
<div class="card">
💺
<h2>140</h2>
Toplam Masa
</div>

<div class="card">
🏢
<h2>5</h2>
Bina
</div>

<div class="card">
🟢
<h2>140</h2>
Müsait
</div>
</div>

<div id="app"></div>

<div class="modal" id="modal">

<div class="modalBox">

<h2 id="masaKod"></h2>

<input
id="studentNo"
placeholder="10 Haneli Öğrenci Numarası"
>

<button onclick="masaAl()">
Masayı Kullan
</button>

<button onclick="kapat()">
Kapat
</button>

</div>

</div>

<script>

const buildings=[
{isim:"📚 Kütüphane",kod:"KTP",adet:50},
{isim:"🏢 Çelik Bina",kod:"CLK",adet:30},
{isim:"📦 Ambar Binası",kod:"AMB",adet:20},
{isim:"🏭 Fabrika Binası",kod:"FAB",adet:20},
{isim:"🔬 Laboratuvar",kod:"LAB",adet:20}
];

let selectedDesk="";

function updateClock(){
const now=new Date();

document.getElementById("clock").innerHTML=
`
📅 ${now.toLocaleDateString("tr-TR")}
<br>
⏰ ${now.toLocaleTimeString("tr-TR")}
`;
}

setInterval(updateClock,1000);
updateClock();

function showBuildings(){

let html='<div class="grid">';

buildings.forEach(b=>{

html+=`
<div class="building"
onclick="showDesks('${b.kod}',${b.adet},'${b.isim}')">

<h2>${b.isim}</h2>
<br>
${b.adet} Masa

</div>
`;

});

html+='</div>';

document.getElementById("app").innerHTML=html;
}

function showDesks(code,count,title){

let html=`
<button class="backBtn"
onclick="showBuildings()">
← Geri
</button>

<h2>${title}</h2>

<div class="masaGrid">
`;

for(let i=1;i<=count;i++){

html+=`
<div class="masa"
onclick="selectDesk('${code}-${String(i).padStart(3,'0')}')">

${code}-${String(i).padStart(3,'0')}
<br>
BOŞ

</div>
`;

}

html+='</div>';

document.getElementById("app").innerHTML=html;
}

function selectDesk(code){

selectedDesk=code;

document.getElementById("masaKod").innerText=code;

document.getElementById("modal").style.display="flex";
}

function kapat(){
document.getElementById("modal").style.display="none";
}

function masaAl(){

let no=
document.getElementById("studentNo")
.value.trim();

if(!/^[0-9]{10}$/.test(no)){
alert("Öğrenci numarası tam 10 haneli olmalıdır.");
return;
}

const existing=
localStorage.getItem("aktif_ogrenci");

if(existing===no){
alert("Bu öğrenci zaten aktif bir masa kullanıyor.");
return;
}

localStorage.setItem(
"aktif_ogrenci",
no
);

document.getElementById("userBox").style.display="block";

document.getElementById("userBox").innerHTML=
`
✅ Giriş Yapıldı

<br><br>

Öğrenci:
${no}

<br>

Aktif Masa:
${selectedDesk}
`;

alert(
selectedDesk+
" başarıyla alındı."
);

kapat();

}

showBuildings();

</script>
</body>
</html>
